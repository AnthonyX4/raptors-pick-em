# Saves one real copy of each cdn.nba.com feed the poller reads, as a downloadable artifact.
# Nothing in development can reach the cdn (nba.com refuses this project's sandboxes), so these
# samples are how the poller's parsing gets written and tested against the real shapes. Run it
# from the Actions tab whenever the poller's tests need fresh samples, e.g. during a live game.
name: Capture NBA samples

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: "A finished game whose box score to save"
        default: "0022600088"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch through nba_api, as the poller does
        shell: bash
        env:
          GAME_ID: ${{ inputs.game_id }}
        run: |
          pip install --quiet nba_api
          mkdir samples
          python - <<'PY'
          import json, os
          import requests
          from nba_api.live.nba.endpoints import boxscore, scoreboard
          from nba_api.live.nba.library.http import NBALiveHTTP

          def save(name, data):
              with open(f"samples/{name}.json", "w") as f:
                  json.dump(data, f, indent=1)
              print(f"saved {name}.json")

          save("scoreboard", scoreboard.ScoreBoard(timeout=20).get_dict())
          save("boxscore", boxscore.BoxScore(os.environ["GAME_ID"], timeout=20).get_dict())
          response = requests.get(
              "https://cdn.nba.com/static/json/staticData/scheduleLeagueV2_1.json",
              headers=NBALiveHTTP.headers, timeout=30,
          )
          response.raise_for_status()
          save("schedule", response.json())
          PY

      # the same samples, compressed into the job log: some environments (this project's own dev
      # sandbox included) can read job logs but not artifact downloads, which come from blob storage.
      # the schedule is cut down to the followed team's games to keep it small
      - name: Print the samples into the log
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open("samples/schedule.json") as f:
              schedule = json.load(f)
          for day in schedule["leagueSchedule"]["gameDates"]:
              day["games"] = [g for g in day["games"] if "TOR" in (g["homeTeam"]["teamTricode"], g["awayTeam"]["teamTricode"])]
          schedule["leagueSchedule"]["gameDates"] = [d for d in schedule["leagueSchedule"]["gameDates"] if d["games"]]
          with open("samples/schedule_tor.json", "w") as f:
              json.dump(schedule, f)
          PY
          tar czf samples.tgz -C samples scoreboard.json boxscore.json schedule_tor.json
          echo "SAMPLES-BEGIN"; base64 -w 1000 samples.tgz; echo "SAMPLES-END"

      - uses: actions/upload-artifact@v4
        with:
          name: nba-samples
          path: samples/
          retention-days: 7
