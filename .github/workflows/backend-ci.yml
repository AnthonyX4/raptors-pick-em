# Runs on every push to main that touches the backend:
#   - tests: migrations applied to an empty postgres, checked against the models, undone and reapplied;
#     then the whole suite on postgres, the database production runs
#   - compose: docker-compose.yml brought up as you'd run it: db, migrate, api, poller
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: raptors
          POSTGRES_PASSWORD: raptors
          POSTGRES_DB: raptors
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raptors"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://raptors:raptors@localhost:5432/raptors
      TEST_DATABASE_URL: postgresql+asyncpg://raptors:raptors@localhost:5432/raptors_test
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789
      S3_BUCKET_NAME: ci-bucket
      PGPASSWORD: raptors
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: Migrations apply, match the models, and undo cleanly
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Seed onto the migrated schema
        run: uv run python harvest_scripts/seed.py

      - name: Tests on postgres
        run: |
          psql -h localhost -U raptors -d raptors -c "CREATE DATABASE raptors_test"
          uv run pytest -q -p no:warnings

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the shape of a real Backend/.env; compose replaces its DATABASE_URL with the db service's
      - name: A throwaway Backend/.env
        run: |
          printf 'SECRET_KEY=ci-only-not-a-real-secret-key-0123456789\nS3_BUCKET_NAME=ci-bucket\nDATABASE_URL=postgresql+asyncpg://raptors:raptors@localhost:5433/raptors\n' > Backend/.env

      - name: Build the image
        run: docker compose build

      - name: What's in it
        run: |
          docker image ls raptors-pick-em
          echo "runs as: $(docker run --rm raptors-pick-em:local id)"
          echo "/app holds:"; docker run --rm raptors-pick-em:local ls -A /app
          docker run --rm raptors-pick-em:local python -c "import fastapi, nba_api, PIL, argon2, asyncpg, alembic; print('imports ok')"

      # api pulls in db and migrate through depends_on; the poller waits until there's data to poll
      - name: Start db, migrate and api
        run: |
          docker compose up -d api
          for i in $(seq 1 60); do curl -fsS localhost:8000/health && echo && break; sleep 1; done
          docker compose ps -a

      - name: Migrate ran once and exited 0
        run: |
          docker compose ps -a migrate --format '{{.Service}} {{.State}} {{.ExitCode}}'
          docker compose logs migrate | grep "Running upgrade"

      - name: Seed, as a one-off container
        run: docker compose run --rm --no-deps api python harvest_scripts/seed.py

      - name: Smoke test the API
        run: |
          curl -fsS localhost:8000/health
          echo; echo "--- headers on GET /"
          curl -fsS -D - -o /dev/null localhost:8000/ | grep -i -E "^(x-frame|x-content|referrer|strict)"
          echo "--- next game"
          curl -fsS "localhost:8000/api/games?upcoming=true&limit=1" | python3 -m json.tool
          echo "--- pick categories"
          curl -fsS localhost:8000/api/pick-categories | python3 -c "import json,sys; print([c['key'] for c in json.load(sys.stdin)])"

      - name: Start the poller and let it run a tick against the live CDN
        run: |
          docker compose up -d poller
          for i in $(seq 1 60); do docker compose logs poller | grep -q "scored\|schedule:" && break; sleep 1; done
          sleep 5
          docker compose logs poller

      - name: The API saw the poller's writes (same database)
        run: curl -fsS "localhost:8000/api/games?status=final&limit=1" | python3 -c "import json,sys; p=json.load(sys.stdin); print(p['total'], 'final games')"

      - name: The api reports healthy to compose
        run: docker compose ps api --format '{{.Service}} {{.Status}}'

      - name: Data survives docker compose down and up
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS localhost:8000/health >/dev/null && break; sleep 1; done
          curl -fsS "localhost:8000/api/games?status=final&limit=1" | python3 -c "import json,sys; p=json.load(sys.stdin); print(p['total'], 'final games after down and up')"

      - name: Stops cleanly on SIGTERM
        run: |
          docker compose stop api poller
          docker compose ps -a api poller --format '{{.Service}} {{.State}} exit {{.ExitCode}}'
          docker compose logs api | tail -n 3
          docker compose logs poller | tail -n 2

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
