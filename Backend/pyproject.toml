[project]
name = "fullstack-raptors"
version = "0.1.0"
description = "Raptors Pick'em and game chat API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.44.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "nba-api>=1.10.0", # harvest scripts now, the step 11 live-score poller later
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "tzdata>=2026.6",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.1.1",
]
