# Serves the built app and forwards the api. The browser only ever talks to this origin, so there is
# no cors and no api url in the build (the same shape as vite's dev proxy). `api` is the compose service.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # profile pictures are uploaded through here: the api allows 5 MB, so nginx's 1 MB default would
    # refuse them with an html error page the app can't read
    client_max_body_size 6m;

    # the api, and /static for the default avatar (its image_path is /static/profile_pics/default.jpg).
    # the api sets its own security headers, so none are added to these
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # vite names built files by their content hash, so they can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # everything else is the app: /games/123 has no file, so fall back to index.html and let the router
    # take it (without this, refreshing a game page is a 404). index.html names the hashed files, so it
    # must never be cached or a deploy wouldn't reach people who already have the page
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
